version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: kyradi_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: kyradi
      MONGO_INITDB_ROOT_PASSWORD: kyradi_dev_password
      MONGO_INITDB_DATABASE: kyradi
    volumes:
      - kyradi_db_data:/data/db

volumes:
  kyradi_db_data:
