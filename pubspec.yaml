name: kyradi_app
description: "KYRADI mobil uygulaması."
publish_to: 'none'

version: 1.0.0+111

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  flutter_localizations: # ✅ çoklu dil için
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_polyline_points: ^2.0.0
  mobile_scanner: ^7.1.4
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  vibration: ^3.1.5
  qr_flutter: ^4.1.0

  # --- Harita / Konum / İzinler ---
  google_maps_flutter: ^2.9.0
  google_maps_flutter_web: ^0.5.14+2
  geolocator: ^10.1.0
  geolocator_web: ^2.2.1
  permission_handler: ^11.3.0
  google_sign_in: 6.3.0
  sign_in_with_apple: ^6.1.1
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  go_router: ^14.2.0

  # --- Launcher & Media ---
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  image_picker_for_web: ^3.0.5

  # --- Uluslararasılaştırma ---
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  package_rename: ^1.10.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  google_sign_in_ios:
    path: third_party/google_sign_in_ios

flutter:
  uses-material-design: true
  generate: true   # ✅ ARB dosyalarını kullanabilmen için
  assets:
    - assets/images/kyradi_logo.png
    - assets/images/kyradi_app_icon.png
    - assets/images/kyradi_app_icon.png

package_rename_config:
  android:
    app_name: "KYRADI"
    package_name: "com.kyradi.app"
  ios:
    app_name: "KYRADI"
    bundle_name: "KYRADI"
    package_name: "com.dilan.bavulgooappp"
  web:
    app_name: "KYRADI"
  macos:
    app_name: "KYRADI"
  windows:
    app_name: "KYRADI"
  linux:
    app_name: "KYRADI"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/kyradi_logo.png"
  remove_alpha_ios: true
